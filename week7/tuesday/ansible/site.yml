---
- name: Configure KijaniKiosk staging servers
  hosts: staging
  become: true

  tasks:
    - name: Copy deployment script
      ansible.builtin.copy:
        src: scripts/deploy-app.sh
        dest: /opt/kijanikiosk/scripts/deploy-app.sh
        owner: root
        group: kijanikiosk
        mode: "0750"

      tags:
        - deployment
